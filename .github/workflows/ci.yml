name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./ci.db"
      JWT_SECRET: "ci-test-secret-not-real-please-change"
      AI_MODE: "simulated"
      NODE_ENV: "test"
      SIMULATION_AUTO_ADVANCE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Run test suite
        run: npm test
