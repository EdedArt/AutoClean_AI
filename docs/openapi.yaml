openapi: 3.0.3
info:
  title: AutoClean AI API
  version: 1.0.0
  description: >-
    REST API for the AutoClean AI smart car wash management system.
    Includes full vehicle lifecycle tracking, bay assignment, simulated car wash phases
    (PENDIENTE, REMOJO, LAVADO, SECADO, LISTO) with an automated background scheduler,
    manual demo controls for presentations, deterministic AI delivery time predictions,
    and photographic evidence upload per service phase.
servers:
  - url: http://localhost:3000
    description: Local development server
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Service health and readiness status
  - name: Vehicles
    description: Vehicle catalog and registration with plate validation (XXX-123)
  - name: Bays
    description: Washing bays availability and occupancy status
  - name: Packages
    description: Wash and detailing service packages
  - name: Orders
    description: Service order lifecycle management and phase tracking
  - name: Simulation
    description: Demo controls for real-time phase overrides and simulation controls
  - name: Prediction
    description: Deterministic AI delivery time estimation with delay detection
  - name: Evidence
    description: Photographic evidence management and upload per order phase
  - name: Auth
    description: User registration, login, and identity verification with JWT
  - name: AI
    description: Gemini AI camera vision analysis and status
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new client account
      description: Public self-registration for car owners. Always assigns role CLIENTE.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              StandardClient:
                summary: New client account registration
                value:
                  nombre: Carlos Gomez
                  email: carlos@example.com
                  password: Password123!
      responses:
        '201':
          description: Client account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user credentials
      description: Verifies email and password and returns a signed JWT Bearer token along with user profile.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              OperatorLogin:
                summary: Operator login credentials
                value:
                  email: operario@autoclean.com
                  password: Demo12345!
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get current authenticated user profile
      description: Returns the authenticated user's profile and assigned role based on the Bearer token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/health:
    get:
      tags:
        - Health
      summary: Service health check
      description: Returns operational status and current server timestamp.
      security: []
      responses:
        '200':
          description: Service is healthy and operational
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-10-23T17:00:00.000Z'

  /api/vehicles:
    get:
      tags:
        - Vehicles
      summary: List all vehicles
      description: >-
        Returns registered vehicles with search and pagination support, wrapped in a pagination envelope. Role visibility: OPERARIO users see all vehicles; CLIENTE users only see vehicles they own (where ownerId matches their user ID).
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (1-indexed, default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: Number of vehicles per page (between 1 and 50, default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
        - name: search
          in: query
          required: false
          description: Search term matching placa, marca, or modelo (case-insensitive ASCII, 1 to 20 chars)
          schema:
            type: string
            minLength: 1
            maxLength: 20
            example: maz
      responses:
        '200':
          description: Paginated envelope with vehicles data and pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
        - Vehicles
      summary: Register a new vehicle
      description: >-
        Creates a new vehicle. Plate must follow XXX-123 format and is normalized to uppercase. Requires color and ownerName. If ownerEmail is provided, associates the vehicle with an existing CLIENTE user (returns 404 OWNER_NOT_FOUND if user does not exist, or 400 INVALID_OWNER if user is not a CLIENTE). Restricted to OPERARIO role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
            examples:
              MazdaCX50:
                summary: Example Mazda CX-50 with client owner
                value:
                  placa: XYZ-123
                  marca: Mazda
                  modelo: CX-50
                  color: Rojo
                  ownerName: Edgar Arteaga
                  ownerEmail: cliente@autoclean.com
                  nivelSuciedad: Moderado
      responses:
        '201':
          description: Vehicle created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/vehicles/{id}:
    get:
      tags:
        - Vehicles
      summary: Get vehicle by ID
      description: >-
        Retrieves a single vehicle by its numeric identifier. Role visibility: OPERARIO can view any vehicle; CLIENTE users can only view vehicles they own (returns 404 NOT_FOUND for other clients' vehicles without disclosing existence).
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric identifier of the vehicle
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Vehicle details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/vehicles/{id}/owner:
    patch:
      tags:
        - Vehicles
      summary: Link or update vehicle owner by client email
      description: Associates an existing vehicle with a registered CLIENTE account using their email address. Restricted to OPERARIO role. Returns 404 NOT_FOUND if the vehicle is not found, 404 OWNER_NOT_FOUND if the email is not registered, or 400 INVALID_OWNER if the user is not a CLIENTE.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric identifier of the vehicle
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleOwnerRequest'
            examples:
              LinkOwner:
                summary: Link vehicle to client account
                value:
                  ownerEmail: cliente@autoclean.com
      responses:
        '200':
          description: Vehicle owner updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/bays/summary:
    get:
      tags:
        - Bays
      summary: Get bay occupancy summary
      description: Returns counts of total, occupied, and free washing bays.
      responses:
        '200':
          description: Bay occupancy summary counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaySummary'

  /api/bays:
    get:
      tags:
        - Bays
      summary: List all bays
      description: Returns all washing bays ordered by number, including current occupancy status.
      responses:
        '200':
          description: Array of washing bays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bay'

  /api/packages:
    get:
      tags:
        - Packages
      summary: List all packages
      description: Returns available wash and detailing service packages.
      responses:
        '200':
          description: Array of service packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Package'

  /api/orders:
    get:
      tags:
        - Orders
      summary: List all service orders
      description: >-
        Returns service orders with nested relations, supporting filters (placa, fase, bayId, activeOnly), sorting, and pagination in a standard envelope. Role visibility: OPERARIO users see all orders; CLIENTE users only see orders for vehicles they own.
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (1-indexed, default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: Number of orders per page (between 1 and 50, default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
        - name: placa
          in: query
          required: false
          description: Filter by related vehicle plate (partial or full match, normalized to uppercase)
          schema:
            type: string
            example: XYZ
        - name: fase
          in: query
          required: false
          description: Filter by exact service phase
          schema:
            $ref: '#/components/schemas/Phase'
        - name: bayId
          in: query
          required: false
          description: Filter by assigned bay numeric ID
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: activeOnly
          in: query
          required: false
          description: When true, filters out completed orders (faseActual LISTO)
          schema:
            type: boolean
            example: true
        - name: active
          in: query
          required: false
          description: When true, filters orders currently active (deliveredAt null); when false, filters delivered orders
          schema:
            type: boolean
            example: true
        - name: sort
          in: query
          required: false
          description: Sort order by creation timestamp (newest or oldest, default newest)
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
            example: newest
      responses:
        '200':
          description: Paginated envelope with orders data and pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/ValidationError'

    post:
      tags:
        - Orders
      summary: Create a new service order
      description: Creates a new service order. If a bay is selected, it must not be currently occupied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              StandardOrder:
                summary: New order with vehicle, package, and bay
                value:
                  vehicleId: 1
                  packageId: 1
                  bayId: 1
      responses:
        '201':
          description: Service order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/phases:
    get:
      tags:
        - Orders
      summary: Get car wash phases catalog
      description: Returns the list of valid car wash phases with progress percentage, display label, and display order. Authenticated for both OPERARIO and CLIENTE.
      responses:
        '200':
          description: List of wash phases catalog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhaseCatalogItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/orders/{id}/ready:
    post:
      tags:
        - Orders
      summary: Mark order as ready to wash
      description: Marks a PENDIENTE order as ready to wash (listoParaLavar=true, readyAt=now). Restricted to role OPERARIO.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric identifier of the service order
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Service order successfully marked ready to wash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/orders/{id}/deliver:
    post:
      tags:
        - Orders
      summary: Deliver service order
      description: Marks an order in LISTO phase as delivered by recording deliveredAt timestamp. Restricted to role OPERARIO.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric identifier of the service order
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Service order successfully marked as delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/orders/{id}/timeline:
    get:
      tags:
        - Orders
      summary: Get order phase timeline
      description: >-
        Returns the chronological sequence of PhaseEvents for a service order. Role visibility: OPERARIO can view any order; CLIENTE receives 404 for orders belonging to other clients.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric identifier of the service order
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Chronological list of phase events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhaseEvent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders/{id}/phase:
    patch:
      tags:
        - Orders
      summary: Update service order phase
      description: Advances or updates the current phase and automatically updates progress percentage (PENDIENTE=10%, REMOJO=30%, LAVADO=55%, SECADO=80%, LISTO=100%).
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric identifier of the service order
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhaseRequest'
            examples:
              LavadoPhase:
                summary: Move to LAVADO phase
                value:
                  faseActual: LAVADO
      responses:
        '200':
          description: Order phase updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/orders/track/{placa}:
    get:
      tags:
        - Orders
      summary: Track latest order by vehicle plate
      description: >-
        Retrieves the most recent service order for a given vehicle plate (XXX-123) including embedded AI delivery time prediction. Role visibility: OPERARIO can track any vehicle; CLIENTE can only track their own vehicle plates (unowned plates return 404 NOT_FOUND identical to non-existent plates).
      parameters:
        - name: placa
          in: path
          required: true
          description: License plate to track (e.g. XYZ-123)
          schema:
            type: string
            example: XYZ-123
      responses:
        '200':
          description: Service order tracking details with prediction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders/{id}/prediction:
    get:
      tags:
        - Prediction
      summary: Get AI delivery time prediction
      description: >-
        Calculates estimated delivery time, deterministic accuracy percentage (88-97%), and delay status. Accuracy is 100% if the order is already in phase LISTO. Role visibility: OPERARIO has full access; CLIENTE receives 404 NOT_FOUND if the order belongs to another client's vehicle.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric identifier of the service order
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: AI delivery time prediction metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prediction'
              examples:
                StandardPrediction:
                  summary: Active order prediction
                  value:
                    estimatedDeliveryTime: '2026-10-23T12:35:00.000Z'
                    accuracyPercentage: 94
                    recalculated: false
                    message: null
                DelayedPrediction:
                  summary: Delayed order prediction
                  value:
                    estimatedDeliveryTime: '2026-10-23T12:45:00.000Z'
                    accuracyPercentage: 94
                    recalculated: true
                    message: Tiempo recalculado por posible retraso
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders/{id}/simulate/advance:
    post:
      tags:
        - Simulation
      summary: Force advance order to next phase
      description: Demo control to immediately force an active order to its next phase (PENDIENTE -> REMOJO -> LAVADO -> SECADO -> LISTO), updating progress percentage and resetting the simulation timer.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric identifier of the service order
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Order successfully advanced to next phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders/{id}/simulate/reset:
    post:
      tags:
        - Simulation
      summary: Reset order back to start
      description: Demo control to reset an order back to PENDIENTE with 10% progress and restart the background simulation timer.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric identifier of the service order
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Order successfully reset to PENDIENTE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders/{id}/simulate/complete:
    post:
      tags:
        - Simulation
      summary: Force complete order to LISTO
      description: Demo control to immediately mark an order as completed (LISTO) with 100% progress.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric identifier of the service order
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Order successfully completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders/{orderId}/evidence:
    post:
      tags:
        - Evidence
      summary: Upload photo evidence for a service order
      description: >-
        Uploads an image evidence file (JPEG, PNG, WEBP, max 5 MB) associated with a service order.
        An optional `etapa` field can be provided; if omitted, it defaults to the order's current phase.
        Files are stored in the local filesystem at `storage/evidence` and served statically.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Numeric identifier of the service order
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Photographic image file (JPEG, PNG, WEBP, max 5 MB)
                etapa:
                  $ref: '#/components/schemas/Phase'
                  description: Order phase for the evidence (defaults to order's current phase)
      responses:
        '201':
          description: Photographic evidence uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags:
        - Evidence
      summary: List all photo evidences for a service order
      description: >-
        Retrieves all photo evidence records for the specified service order ordered by creation date descending. Role visibility: OPERARIO has full access; CLIENTE receives 404 NOT_FOUND if the order belongs to another client's vehicle.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Numeric identifier of the service order
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Array of photo evidence records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/ai/status:
    get:
      tags:
        - AI
      summary: Retrieve AI vision system runtime status
      description: >-
        Returns the active AI mode, effective provider, model name, whether an API key is configured (boolean only), fallback status, and minimum confidence threshold. Role visibility: OPERARIO only.
      responses:
        '200':
          description: AI system status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/orders/{id}/analyze:
    post:
      tags:
        - AI
      summary: Analyze camera frame image to verify plate and classify wash phase
      description: >-
        Analyzes a camera frame photo of a vehicle in the wash bay. Detects license plate, verifies it matches the order's vehicle, and classifies the wash phase. If plate matches, automatically advances the order phase. Role visibility: OPERARIO only.
      parameters:
        - name: id
          in: path
          required: true
          description: Service order ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Vehicle photo frame (JPEG, PNG, WEBP, max 5 MB)
                scenario:
                  type: string
                  enum: [wrong_vehicle, unreadable, regression, low_confidence]
                  description: Optional demo scenario (honored only by simulated provider)
                saveEvidence:
                  type: boolean
                  default: true
                  description: Whether to save the analyzed frame as photo evidence if plate matches
      responses:
        '200':
          description: Analysis completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAnalysisResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: PLATE_UNREADABLE error when plate cannot be deciphered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PlateUnreadable:
                  summary: Plate unreadable or low confidence
                  value:
                    error:
                      code: PLATE_UNREADABLE
                      message: Unable to read license plate with sufficient confidence
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: AI service unavailable or rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AiUnavailable:
                  summary: AI vision unavailable
                  value:
                    error:
                      code: AI_UNAVAILABLE
                      message: AI vision service is temporarily unavailable
                AiRateLimited:
                  summary: AI rate limit exceeded
                  value:
                    error:
                      code: AI_RATE_LIMITED
                      message: "AI service rate limit exceeded. Please retry in 60 seconds (Retry-After: 60)."

  /api/orders/{id}/analyses:
    get:
      tags:
        - AI
      summary: Retrieve paginated AI analysis history for a service order
      description: >-
        Returns the history of AI camera frame analysis events for a service order in descending chronological order. Role visibility: OPERARIO only.
      parameters:
        - name: id
          in: path
          required: true
          description: Service order ID
          schema:
            type: integer
            example: 1
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: Items per page (max 50)
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        '200':
          description: Paginated AI analysis history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAnalysesListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide the JWT Bearer token obtained from POST /api/auth/login

  schemas:
    UserRole:
      type: string
      enum:
        - OPERARIO
        - CLIENTE
      example: OPERARIO

    UserProfile:
      type: object
      required:
        - id
        - email
        - nombre
        - rol
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: operario@autoclean.com
        nombre:
          type: string
          example: Operario Demo
        rol:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-23T18:00:00.000Z'

    RegisterRequest:
      type: object
      required:
        - nombre
        - email
        - password
      properties:
        nombre:
          type: string
          example: Carlos Gomez
        email:
          type: string
          format: email
          example: carlos@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Password123!

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: operario@autoclean.com
        password:
          type: string
          format: password
          example: Demo12345!

    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserProfile'

    Phase:
      type: string
      enum:
        - PENDIENTE
        - REMOJO
        - LAVADO
        - SECADO
        - LISTO
      description: Canonical car wash service phases
      example: PENDIENTE

    Vehicle:
      type: object
      required:
        - id
        - placa
        - marca
        - modelo
        - color
        - ownerName
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        placa:
          type: string
          example: XYZ-123
          description: Unique license plate in format XXX-123
        marca:
          type: string
          example: Mazda
        modelo:
          type: string
          example: CX-50
        color:
          type: string
          example: Rojo
        ownerName:
          type: string
          example: Edgar Arteaga
        ownerId:
          type: integer
          nullable: true
          example: 2
          description: Foreign key to User account if linked to a CLIENTE
        nivelSuciedad:
          type: string
          enum: [Leve, Moderado, Severo]
          nullable: true
          example: Moderado
        createdAt:
          type: string
          format: date-time
          example: '2026-10-23T12:00:00.000Z'

    Bay:
      type: object
      required:
        - id
        - numero
        - ocupada
      properties:
        id:
          type: integer
          example: 1
        numero:
          type: integer
          example: 1
        ocupada:
          type: boolean
          example: false

    Package:
      type: object
      required:
        - id
        - nombre
        - descripcion
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Lavado Premium
        descripcion:
          type: string
          example: Lavado exterior a presión, aspirado profundo y encerado
        precio:
          type: number
          format: float
          nullable: true
          example: 35000.0

    Prediction:
      type: object
      required:
        - estimatedDeliveryTime
        - accuracyPercentage
        - recalculated
        - message
      properties:
        estimatedDeliveryTime:
          type: string
          format: date-time
          example: '2026-10-23T12:35:00.000Z'
        accuracyPercentage:
          type: integer
          minimum: 88
          maximum: 100
          example: 94
        recalculated:
          type: boolean
          example: false
        message:
          type: string
          nullable: true
          example: null

    Evidence:
      type: object
      required:
        - id
        - url
        - etapa
        - serviceOrderId
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        url:
          type: string
          example: /evidence/1729700000000-123456789.jpg
          description: Relative path to access the stored image
        etapa:
          type: string
          example: LAVADO
          description: Service phase during which the photo was captured
        serviceOrderId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: '2026-10-23T12:15:00.000Z'

    ServiceOrder:
      type: object
      required:
        - id
        - vehicleId
        - faseActual
        - porcentajeProgreso
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          example: 1
        vehicleId:
          type: integer
          example: 1
        packageId:
          type: integer
          nullable: true
          example: 1
        bayId:
          type: integer
          nullable: true
          example: 1
        faseActual:
          $ref: '#/components/schemas/Phase'
        porcentajeProgreso:
          type: integer
          minimum: 0
          maximum: 100
          example: 55
        listoParaLavar:
          type: boolean
          example: false
          description: Whether the vehicle has been marked ready to wash by an operator
        readyAt:
          type: string
          format: date-time
          nullable: true
          example: null
          description: Timestamp when the order was marked ready to wash
        horaEstimadaEntrega:
          type: string
          format: date-time
          nullable: true
          example: null
        deliveredAt:
          type: string
          format: date-time
          nullable: true
          example: null
          description: Timestamp when the order was delivered to the client
        etaMinutes:
          type: integer
          example: 25
          description: Realistic remaining minutes until vehicle is ready
        etaLabel:
          type: string
          example: Aprox. 25 min
          description: Human-readable realistic ETA label
        estimatedReadyAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-23T12:40:00.000Z'
          description: Estimated ISO 8601 timestamp when vehicle is ready
        createdAt:
          type: string
          format: date-time
          example: '2026-10-23T12:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-23T12:15:00.000Z'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        package:
          allOf:
            - $ref: '#/components/schemas/Package'
          nullable: true
        bay:
          allOf:
            - $ref: '#/components/schemas/Bay'
          nullable: true

    PhaseEvent:
      type: object
      required:
        - id
        - orderId
        - fase
        - label
        - progreso
        - source
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        orderId:
          type: integer
          example: 1
        fase:
          $ref: '#/components/schemas/Phase'
        label:
          type: string
          example: Pendiente
        progreso:
          type: integer
          example: 10
        source:
          type: string
          enum: [MANUAL, SIMULATION, DEMO, AI]
          example: MANUAL
        createdAt:
          type: string
          format: date-time
          example: '2026-10-23T12:00:00.000Z'

    PhaseCatalogItem:
      type: object
      required:
        - code
        - label
        - progress
        - order
      properties:
        code:
          $ref: '#/components/schemas/Phase'
        label:
          type: string
          example: Pendiente
        progress:
          type: integer
          example: 10
        order:
          type: integer
          example: 1

    TrackedOrder:
      allOf:
        - $ref: '#/components/schemas/ServiceOrder'
        - type: object
          properties:
            prediction:
              $ref: '#/components/schemas/Prediction'

    CreateVehicleRequest:
      type: object
      required:
        - placa
        - marca
        - modelo
        - color
        - ownerName
      properties:
        placa:
          type: string
          pattern: '^[A-Za-z]{3}-[0-9]{3}$'
          example: XYZ-123
          description: License plate format XXX-123 (automatically uppercase normalized)
        marca:
          type: string
          example: Mazda
        modelo:
          type: string
          example: CX-50
        color:
          type: string
          maxLength: 30
          example: Rojo
        ownerName:
          type: string
          minLength: 2
          maxLength: 80
          example: Edgar Arteaga
        ownerEmail:
          type: string
          format: email
          example: cliente@autoclean.com
          description: Optional email of registered CLIENTE user to link vehicle ownership
        nivelSuciedad:
          type: string
          enum: [Leve, Moderado, Severo]
          example: Moderado
          description: Optional dirt level assessment (evaluated by AI in later phases)

    UpdateVehicleOwnerRequest:
      type: object
      required:
        - ownerEmail
      properties:
        ownerEmail:
          type: string
          format: email
          example: cliente@autoclean.com
          description: Email of registered CLIENTE account to associate as owner

    CreateOrderRequest:
      type: object
      required:
        - vehicleId
      properties:
        vehicleId:
          type: integer
          example: 1
          description: ID of registered vehicle
        packageId:
          type: integer
          nullable: true
          example: 1
          description: Optional wash package ID
        bayId:
          type: integer
          nullable: true
          example: 1
          description: Optional bay ID (must be unoccupied)

    UpdatePhaseRequest:
      type: object
      required:
        - faseActual
      properties:
        faseActual:
          $ref: '#/components/schemas/Phase'

    ErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: placa
        message:
          type: string
          example: Placa must be in format XXX-123 (three letters, hyphen, three digits)

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Validation failed
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
          example: 10
        total:
          type: integer
          minimum: 0
          example: 25
        totalPages:
          type: integer
          minimum: 0
          example: 3

    VehicleList:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    OrderList:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrder'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    BaySummary:
      type: object
      required:
        - total
        - occupied
        - free
      properties:
        total:
          type: integer
          example: 4
          description: Total number of washing bays
        occupied:
          type: integer
          example: 2
          description: Number of bays currently occupied
        free:
          type: integer
          example: 2
          description: Number of bays currently available

    AiStatus:
      type: object
      required:
        - mode
        - effectiveProvider
        - model
        - keyConfigured
        - fallbackEnabled
        - minConfidence
      properties:
        mode:
          type: string
          enum: [auto, gemini, simulated]
          example: auto
        effectiveProvider:
          type: string
          enum: [gemini, simulated]
          example: simulated
        model:
          type: string
          example: gemini-3.1-flash-lite
        keyConfigured:
          type: boolean
          example: false
          description: Whether GEMINI_API_KEY is configured in server environment
        fallbackEnabled:
          type: boolean
          example: true
        minConfidence:
          type: number
          example: 0.6

    AiAnalysis:
      type: object
      required:
        - id
        - orderId
        - provider
        - model
        - plateMatched
        - outcome
        - fallbackUsed
        - latencyMs
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        orderId:
          type: integer
          example: 1
        provider:
          type: string
          example: gemini
        model:
          type: string
          example: gemini-3.1-flash-lite
        plateDetected:
          type: string
          nullable: true
          example: XYZ-123
        plateMatched:
          type: boolean
          example: true
        phaseDetected:
          type: string
          nullable: true
          example: LAVADO
        confidence:
          type: number
          nullable: true
          example: 0.94
        outcome:
          type: string
          enum: [APPLIED, UNCHANGED, REGRESSION_IGNORED, WRONG_VEHICLE, PLATE_UNREADABLE, LOW_CONFIDENCE, ERROR]
          example: APPLIED
        fallbackUsed:
          type: boolean
          example: false
        latencyMs:
          type: integer
          example: 1240
        createdAt:
          type: string
          format: date-time
          example: '2026-10-23T18:30:00.000Z'

    AiAnalysisResponse:
      type: object
      required:
        - provider
        - model
        - fallbackUsed
        - plate
        - phase
        - order
      properties:
        provider:
          type: string
          example: gemini
        model:
          type: string
          example: gemini-3.1-flash-lite
        fallbackUsed:
          type: boolean
          example: false
        plate:
          type: object
          properties:
            detected:
              type: string
              nullable: true
              example: XYZ-123
            expected:
              type: string
              example: XYZ-123
            matched:
              type: boolean
              example: true
            confidence:
              type: number
              example: 0.95
        phase:
          type: object
          properties:
            previous:
              $ref: '#/components/schemas/Phase'
            detected:
              $ref: '#/components/schemas/Phase'
            current:
              $ref: '#/components/schemas/Phase'
            changed:
              type: boolean
              example: true
            regression:
              type: boolean
              example: false
            confidence:
              type: number
              example: 0.92
            source:
              type: string
              enum: [rules, model]
              example: rules
            reason:
              type: string
              nullable: true
              example: Active soap foam or shampoo lather is visibly present on vehicle surface
        observations:
          type: object
          nullable: true
          description: Physical visual indicators observed on vehicle body
          properties:
            soapFoamVisible:
              type: boolean
              example: true
            waterOnCar:
              type: boolean
              example: true
            dryingInProgress:
              type: boolean
              example: false
            visibleDirt:
              type: string
              enum: [none, light, heavy]
              example: none
            cleanAndGlossy:
              type: boolean
              example: false
            observationNotes:
              type: string
              example: Vehicle covered in thick shampoo foam
        phaseSource:
          type: string
          enum: [rules, model]
          example: rules
        phaseReason:
          type: string
          nullable: true
          example: Active soap foam or shampoo lather is visibly present on vehicle surface
        dirtLevel:
          type: string
          nullable: true
          enum: [Leve, Moderado, Severo]
          example: Moderado
        notes:
          type: string
          example: Vehicle covered in active foam shampoo in Bay 1
        evidenceId:
          type: integer
          nullable: true
          example: 42
        order:
          $ref: '#/components/schemas/ServiceOrder'

    AiAnalysesListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AiAnalysis'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

  responses:
    ValidationError:
      description: Bad request due to validation errors, malformed payload, or invalid file type (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            ValidationError:
              summary: Zod field validation error
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Validation failed
                  details:
                    - field: placa
                      message: Placa must be in format XXX-123 (three letters, hyphen, three digits)
            InvalidJson:
              summary: Malformed JSON in request body
              value:
                error:
                  code: INVALID_JSON
                  message: Malformed JSON in request body
            InvalidFileType:
              summary: Unsupported image MIME type
              value:
                error:
                  code: INVALID_FILE_TYPE
                  message: Solo se permiten archivos de imagen (JPEG, PNG, WEBP)
            FileMissing:
              summary: Missing file in multipart form
              value:
                error:
                  code: FILE_MISSING
                  message: No se ha proporcionado ningún archivo de imagen
            OrderCompleted:
              summary: Cannot advance already completed order
              value:
                error:
                  code: ORDER_COMPLETED
                  message: Order is already completed.
            InvalidOwner:
              summary: User is not a CLIENTE (400)
              value:
                error:
                  code: INVALID_OWNER
                  message: Owner user must have CLIENTE role

    NotFound:
      description: Resource or route not found (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            ResourceNotFound:
              summary: Entity not found in database
              value:
                error:
                  code: NOT_FOUND
                  message: Service order not found
            OwnerNotFound:
              summary: Owner user not found by email (404)
              value:
                error:
                  code: OWNER_NOT_FOUND
                  message: Owner user not found
            RouteNotFound:
              summary: Unmatched API route
              value:
                error:
                  code: ROUTE_NOT_FOUND
                  message: Route GET /api/orders/999/unknown not found

    Conflict:
      description: Business conflict or unique constraint violation (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            DuplicateResource:
              summary: Unique constraint violation (e.g. placa)
              value:
                error:
                  code: DUPLICATE_RESOURCE
                  message: A resource with this placa already exists
            BayOccupied:
              summary: Selected bay is already occupied
              value:
                error:
                  code: BAY_OCCUPIED
                  message: Bay is already occupied
            AlreadyReady:
              summary: Order is already marked as ready
              value:
                error:
                  code: ALREADY_READY
                  message: Order is already marked as ready to wash
            InvalidState:
              summary: Order is not in PENDIENTE state
              value:
                error:
                  code: INVALID_STATE
                  message: Order must be in PENDIENTE phase to mark as ready
            NotReady:
              summary: Order is not marked ready to wash
              value:
                error:
                  code: NOT_READY
                  message: Order is not ready to wash yet
            WrongVehicle:
              summary: Plate in image does not match order
              value:
                error:
                  code: WRONG_VEHICLE
                  message: 'Wrong vehicle: the plate in the image does not match this order'
                  details:
                    detected: XYZ-999
                    expected: ABC-123
            ActiveOrderExists:
              summary: Vehicle already has an active order (409)
              value:
                error:
                  code: ACTIVE_ORDER_EXISTS
                  message: Vehicle already has an active service order
                  details:
                    orderId: 1
                    faseActual: LAVADO
            NotFinished:
              summary: Order cannot be delivered until it reaches LISTO phase (409)
              value:
                error:
                  code: NOT_FINISHED
                  message: Order cannot be delivered until it reaches LISTO phase
            AlreadyDelivered:
              summary: Order is already delivered (409)
              value:
                error:
                  code: ALREADY_DELIVERED
                  message: Order is already delivered

    PayloadTooLarge:
      description: Uploaded file or JSON body exceeds maximum allowed size (413)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            FileTooLarge:
              summary: Uploaded image exceeds 5 MB limit
              value:
                error:
                  code: FILE_TOO_LARGE
                  message: File size exceeds maximum allowed limit of 5 MB
            PayloadTooLarge:
              summary: Request JSON body exceeds 100 KB limit
              value:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: Request payload exceeds the maximum allowed limit of 100 KB

    RateLimited:
      description: Rate limit exceeded (429)
      headers:
        RateLimit-Limit:
          description: The maximum number of allowed requests in the current period
          schema:
            type: integer
            example: 100
        RateLimit-Remaining:
          description: The number of remaining requests in the current period
          schema:
            type: integer
            example: 0
        RateLimit-Reset:
          description: The number of seconds until the rate limit resets
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            RateLimited:
              summary: Rate limit quota exceeded
              value:
                error:
                  code: RATE_LIMITED
                  message: Too many requests, please try again later.

    Unauthorized:
      description: Missing, invalid, or expired authentication token (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Unauthorized:
              summary: Missing or invalid token
              value:
                error:
                  code: UNAUTHORIZED
                  message: Authorization token is missing or malformed
            InvalidCredentials:
              summary: Invalid login credentials
              value:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password

    Forbidden:
      description: Access forbidden for user role (403)
